[package]
authors = ["Takahiro Sato <harehare1110@gmail.com>"]
categories = ["command-line-utilities", "text-processing"]
description = "A task runner using Markdown"
edition = "2024"
homepage = "https://task.mqlang.org/"
keywords = ["markdown", "jq", "taskrunner"]
license = "MIT"
name = "mq-task"
readme = "README.md"
repository = "https://github.com/harehare/mq-task"
version = "0.2.3"

[[bin]]
name = "mq-task"
path = "src/main.rs"

[lib]
name = "mq_task"
path = "src/lib.rs"

[dependencies]
clap = {version = "4.6.1", features = ["derive", "env"]}
clap_complete = {version = "4.6.11", features = ["unstable-dynamic"]}
colored = "3.1"
crossterm = "0.29"
ctrlc = "3.5"
glob = "0.3.4"
libc = "0.2.190"
miette = {version = "7.6.0", features = ["fancy"]}
mq-lang = "0.9.3"
mq-markdown = "0.9.3"
ratatui = "0.30"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
thiserror = "2.0.18"
toml = "1.1.2"
unicode-width = "0.2"
which = "8.0.2"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

[dev-dependencies]
proptest = "1.12.0"
rstest = "0.27.0"
tempfile = "3.27.0"

[package.metadata.binstall]
pkg-fmt = "bin"
pkg-url = "{ repo }/releases/download/v{ version }/mq-task-{ target }{ binary-ext }"

